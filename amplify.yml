version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 requires Node ^20.19 || >=22.12. Amplify's default image can be older,
        # so pin it here rather than let the build fail on an obscure syntax error.
        - nvm install 22
        - nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: 'index.html'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache'
    - pattern: 'data/**'
      headers:
        - key: 'Cache-Control'
          value: 'no-cache, no-store, must-revalidate'
